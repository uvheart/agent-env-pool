services:
  agent-env-pool:
    image: uvheart280/agent-env-pool:latest
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Override with AGENT_ENV_POOL_PORT_MAPPING=127.0.0.1::8100 on
      # shared hosts or CI runners where host port 8100 may already be used.
      - "${AGENT_ENV_POOL_PORT_MAPPING:-127.0.0.1:8100:8100}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      AGENT_ENV_POOL_DOCKER_READY_HOST: "host.docker.internal"
