name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  docker-release:
    runs-on: [self-hosted, linux, x64, agent-env-pool-e2e]
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION 2>/dev/null || echo "0.0.0")"
          NOTES="$(python3 - <<'PY'
from pathlib import Path

path = Path("CHANGELOG.md")
if not path.exists():
    print("")
    raise SystemExit

lines = path.read_text().splitlines()
body = []
capture = False
for line in lines:
    if line.startswith("## "):
        if capture:
            break
        capture = True
        continue
    if capture:
        body.append(line)
text = " ".join(line.strip().lstrip("- ").strip() for line in body if line.strip())
print(text[:500])
PY
)"
          {
            echo "version=$VERSION"
            echo "notes=$NOTES"
            python3 - <<PY
import json
version = "$VERSION"
notes = """$NOTES"""
print("extra_json=" + json.dumps({"版本": "v" + version, "版本说明": notes}, ensure_ascii=False))
PY
          } >> "$GITHUB_OUTPUT"

      - name: Notify Feishu - Start
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          EXTRA_JSON: ${{ steps.release.outputs.extra_json }}
        run: scripts/ci/notify-feishu.sh start "Docker Release 发布" "$EXTRA_JSON"

      - name: Install dependencies
        run: python3 -m pip install --user -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements-dev.txt

      - name: Compute image tags
        id: image
        shell: bash
        run: |
          set -euo pipefail
          IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/agent-env-pool"
          SHORT_SHA="${GITHUB_SHA::7}"
          {
            echo "image=$IMAGE"
            echo "sha_tag=$IMAGE:sha-$SHORT_SHA"
            if [[ "$GITHUB_REF_TYPE" == "branch" && "$GITHUB_REF_NAME" == "main" ]]; then
              echo "latest_tag=$IMAGE:latest"
              echo "version_tag=$IMAGE:${{ steps.release.outputs.version }}"
              echo "raw_tag=$IMAGE:v${{ steps.release.outputs.version }}"
            fi
            if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
              echo "version_tag=$IMAGE:${GITHUB_REF_NAME#v}"
              echo "raw_tag=$IMAGE:$GITHUB_REF_NAME"
            fi
          } >> "$GITHUB_OUTPUT"

      - name: Docker build
        run: |
          docker build \
            --label "org.opencontainers.image.version=${{ steps.release.outputs.version }}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.description=${{ steps.release.outputs.notes }}" \
            -t "${{ steps.image.outputs.sha_tag }}" .

      - name: Docker run smoke test
        run: scripts/ci/docker-smoke.sh "${{ steps.image.outputs.sha_tag }}"

      - name: Ensure browser sandbox image exists
        run: docker image inspect zenika/alpine-chrome:124 >/dev/null || docker pull zenika/alpine-chrome:124

      - name: Full lifecycle E2E
        env:
          AGENT_ENV_POOL_DATABASE_URL: sqlite+aiosqlite:///./agent_env_pool_release_${{ github.run_id }}.db
          PYTHON: python3
        run: scripts/ci/e2e-full-lifecycle.sh

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image tags
        shell: bash
        run: |
          set -euo pipefail
          docker push "${{ steps.image.outputs.sha_tag }}"
          if [[ -n "${{ steps.image.outputs.latest_tag }}" ]]; then
            docker tag "${{ steps.image.outputs.sha_tag }}" "${{ steps.image.outputs.latest_tag }}"
            docker push "${{ steps.image.outputs.latest_tag }}"
          fi
          if [[ -n "${{ steps.image.outputs.version_tag }}" ]]; then
            docker tag "${{ steps.image.outputs.sha_tag }}" "${{ steps.image.outputs.version_tag }}"
            docker push "${{ steps.image.outputs.version_tag }}"
          fi
          if [[ -n "${{ steps.image.outputs.raw_tag }}" ]]; then
            docker tag "${{ steps.image.outputs.sha_tag }}" "${{ steps.image.outputs.raw_tag }}"
            docker push "${{ steps.image.outputs.raw_tag }}"
          fi

      - name: Cleanup release database
        if: always()
        run: rm -f agent_env_pool_release_*.db

      - name: Notify Feishu - Success
        if: success()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          EXTRA_JSON: ${{ steps.release.outputs.extra_json }}
        run: scripts/ci/notify-feishu.sh success "Docker Release 发布" "$EXTRA_JSON"

      - name: Notify Feishu - Failure
        if: failure()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          EXTRA_JSON: ${{ steps.release.outputs.extra_json }}
        run: scripts/ci/notify-feishu.sh failure "Docker Release 发布" "$EXTRA_JSON"
