name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "feature/**"
      - "feat/**"
      - "fix/**"
  workflow_dispatch:

jobs:
  unit-lint-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements-dev.txt

      - name: Lint
        run: python -m ruff check .

      - name: Unit/API smoke tests
        env:
          AGENT_ENV_POOL_DATABASE_URL: sqlite+aiosqlite:///./agent_env_pool_ci.db
        run: python -m pytest tests/test_api_smoke.py -q

      - name: Docker build
        run: docker build -t agent-env-pool:ci .

      - name: Notify Feishu on failure
        if: failure()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
        run: scripts/ci/notify-feishu.sh failure "agent-env-pool CI failed"
