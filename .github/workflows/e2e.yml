name: E2E

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  full-lifecycle-e2e:
    runs-on: [self-hosted, linux, x64, agent-env-pool-e2e]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Notify Feishu - Start
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci/notify-feishu.sh start "E2E 全生命周期测试"

      - name: Install dependencies
        run: python3 -m pip install --user -i https://pypi.tuna.tsinghua.edu.cn/simple -r requirements-dev.txt

      - name: Ensure browser sandbox image exists
        run: docker image inspect zenika/alpine-chrome:124 >/dev/null || docker pull zenika/alpine-chrome:124

      - name: Full lifecycle E2E
        env:
          AGENT_ENV_POOL_DATABASE_URL: sqlite+aiosqlite:///./agent_env_pool_e2e_${{ github.run_id }}.db
          PYTHON: python3
        run: scripts/ci/e2e-full-lifecycle.sh

      - name: Cleanup E2E database
        if: always()
        run: rm -f agent_env_pool_e2e_*.db

      - name: Notify Feishu - Success
        if: success()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci/notify-feishu.sh success "E2E 全生命周期测试"

      - name: Notify Feishu - Failure
        if: failure()
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/ci/notify-feishu.sh failure "E2E 全生命周期测试"
